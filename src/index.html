<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Iqra University — Digital PhD & Master's Forms Portal</title>
  <link rel="stylesheet" href="/styles/print-base.css" />
  <link rel="stylesheet" href="/styles/app.css" />
</head>
<body>
  <!-- Header Bar -->
  <header class="app-header no-print">
    <div class="brand-section">
      <button id="btn-toggle-sidebar" class="btn-sidebar-toggle" title="Browse Forms" aria-label="Toggle Navigation Drawer">
        <span class="hamburger-icon">☰</span>
        <span class="btn-sidebar-toggle-text">Forms</span>
      </button>
      <img src="/assets/iqra-logo.png" alt="Iqra University" class="app-brand-logo" />
      <div class="brand-text-block">
        <div class="brand-title">IQRA UNIVERSITY — ACADEMIC FORMS</div>
        <div class="brand-subtitle">Official Postgraduate Forms & PDF Generation System</div>
      </div>
    </div>

    <div class="header-actions">
      <button id="btn-sample-data" class="btn btn-secondary action-btn-sample" title="Populate with realistic official sample data">
        <span>✨ Fill Sample Data</span>
      </button>
      <button id="btn-reset-form" class="btn btn-secondary action-btn-reset" title="Clear all entered fields">
        <span>↺ Clear</span>
      </button>
      <button id="btn-export-json" class="btn btn-secondary action-btn-export" title="Export current form data to JSON">
        <span>📥 Export</span>
      </button>
      <button id="btn-browser-print" class="btn btn-primary action-btn-print" title="Print or save as PDF using high-resolution browser engine">
        <span>🖨️ Print</span>
      </button>
      <button id="btn-server-pdf" class="btn btn-success action-btn-download" title="Generate authoritative PDF using Puppeteer backend">
        <span>📄 Download Official PDF</span>
      </button>

      <!-- Mobile More Menu Button -->
      <button id="btn-mobile-more" class="btn btn-secondary mobile-more-btn" title="More Actions">
        <span>⚙️ Actions</span>
      </button>
    </div>
  </header>

  <!-- Mobile Quick Action Sheet / Dropdown Menu -->
  <div id="mobile-actions-menu" class="mobile-actions-menu no-print">
    <div class="mobile-actions-menu-content">
      <div class="mobile-menu-header">
        <span>Quick Form Actions</span>
        <button id="btn-close-mobile-menu" class="btn-close-sheet">✕</button>
      </div>
      <div class="mobile-menu-items">
        <button id="menu-item-sample" class="mobile-menu-btn">✨ Fill Realistic Sample Data</button>
        <button id="menu-item-reset" class="mobile-menu-btn">↺ Reset / Clear All Fields</button>
        <button id="menu-item-export" class="mobile-menu-btn">📥 Export Data as JSON</button>
        <button id="menu-item-print" class="mobile-menu-btn">🖨️ Direct Browser Print</button>
      </div>
    </div>
  </div>

  <!-- Mobile Backdrop for Sidebar Drawer -->
  <div id="sidebar-backdrop" class="sidebar-backdrop no-print"></div>

  <!-- Main Portal Layout -->
  <div class="app-layout">
    <!-- Sidebar: Stage & Form Navigation -->
    <aside class="app-sidebar no-print" id="app-sidebar">
      <div class="sidebar-header-mobile">
        <span class="sidebar-mobile-title">IU Official Forms</span>
        <button id="btn-close-sidebar" class="btn-close-sidebar" aria-label="Close sidebar">✕</button>
      </div>
      <div class="sidebar-search-box">
        <input type="text" id="form-search-input" placeholder="🔍 Search official forms..." autocomplete="off" />
      </div>
      <div class="sidebar-nav" id="sidebar-nav-container">
        <!-- Injected dynamically by main.js -->
      </div>
      <div class="sidebar-footer">
        <span class="forms-count-badge">15 Official Documents</span>
        <span class="system-status-indicator">● System Ready</span>
      </div>
    </aside>

    <!-- Workspace Area -->
    <div class="workspace-container">
      <!-- Responsive View Switcher Bar (Mobile & Tablet) -->
      <div class="workspace-tabs-bar no-print">
        <button id="tab-btn-form" class="workspace-tab-btn active" data-target="form">
          <span class="tab-icon">📝</span>
          <span class="tab-label">Edit Form</span>
        </button>
        <button id="tab-btn-preview" class="workspace-tab-btn" data-target="preview">
          <span class="tab-icon">👁️</span>
          <span class="tab-label">Live Preview</span>
          <span id="tab-preview-badge" class="tab-mini-badge">A4</span>
        </button>
      </div>

      <!-- Main Workspace Panels Wrapper -->
      <div class="workspace-panels" id="workspace-panels">
        <!-- Left: Interactive Form Pane -->
        <section class="app-form-pane no-print" id="form-panel">
          <div class="form-pane-header">
            <div class="form-pane-info">
              <div class="form-pane-title" id="active-form-title">Select an Official Form</div>
              <div class="form-pane-sub" id="active-form-code">IU Official Document</div>
            </div>
            <div class="form-pane-header-actions">
              <span id="page-budget-badge" class="status-pill success">1 Page Official</span>
              <button id="btn-quick-preview-switch" class="btn-switch-preview-sm" title="View Document Preview">
                <span>View Preview 👁️</span>
              </button>
            </div>
          </div>

          <div class="form-pane-body" id="form-inputs-container">
            <!-- Dynamic Input Controls injected here -->
          </div>
        </section>

        <!-- Right: Live Document Preview Pane -->
        <section class="app-preview-pane" id="preview-panel">
          <div class="preview-toolbar no-print">
            <div class="preview-toolbar-left">
              <span class="preview-toolbar-title">LIVE DOCUMENT PREVIEW</span>
              <span id="preview-status" class="status-pill success">✓ Validated</span>
            </div>

            <div class="preview-toolbar-right">
              <button id="btn-fit-screen" class="btn-fit-screen" title="Auto Fit document to screen width">Fit Screen</button>
              <label class="zoom-label" for="zoom-select">Zoom:</label>
              <select id="zoom-select" class="preview-scale-select">
                <option value="auto">Auto Fit</option>
                <option value="0.45">45% (Mobile)</option>
                <option value="0.60">60% (Compact)</option>
                <option value="0.75">75% (Tablet)</option>
                <option value="0.90" selected>90% (Laptop)</option>
                <option value="1.0">100% (Actual)</option>
                <option value="1.15">115% (Large)</option>
              </select>
            </div>
          </div>

          <div class="preview-viewport" id="preview-viewport">
            <div class="preview-container preview-mode" id="preview-container">
              <!-- Official HTML Page Template rendered here in real time -->
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <!-- Mobile Bottom Action Bar -->
  <nav class="mobile-bottom-bar no-print">
    <button id="mobile-nav-forms" class="mobile-nav-item">
      <span class="nav-icon">📂</span>
      <span class="nav-label">Forms</span>
    </button>
    <button id="mobile-nav-edit" class="mobile-nav-item active">
      <span class="nav-icon">📝</span>
      <span class="nav-label">Edit</span>
    </button>
    <button id="mobile-nav-preview" class="mobile-nav-item">
      <span class="nav-icon">👁️</span>
      <span class="nav-label">Preview</span>
    </button>
    <button id="mobile-nav-download" class="mobile-nav-item primary-action">
      <span class="nav-icon">📄</span>
      <span class="nav-label">Get PDF</span>
    </button>
  </nav>

  <script type="module" src="/main.js"></script>
</body>
</html>
